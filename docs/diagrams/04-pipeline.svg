<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img">
<title>Jenkins DevSecOps pipeline</title>
<desc>Default: AWS_OPERATIONS=false / DEPLOY_TARGET=none • Trusted Linux Docker agent only</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1280" height="900" fill="#f8fafc"/>
<text x="40" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#0f172a">Jenkins DevSecOps pipeline</text>
<text x="40" y="80" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#475569">Default: AWS_OPERATIONS=false / DEPLOY_TARGET=none • Trusted Linux Docker agent only</text>
<g><rect x="100" y="110" width="1080" height="84" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="116" y="140" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#0f172a">Checkout / environment</text>
<text x="116" y="168" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#0f172a">Canonical commit and branch • main-only AWS operations</text>
</g>
<path d="M640,194 L640,222" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g><rect x="100" y="222" width="1080" height="84" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="116" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#0f172a">Gitleaks → dependencies → pytest</text>
<text x="116" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#0f172a">Leaked secrets and failing tests stop the pipeline</text>
</g>
<path d="M640,306 L640,334" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g><rect x="100" y="334" width="1080" height="84" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="116" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#0f172a">Sonar Scanner → Jenkins Quality Gate</text>
<text x="116" y="392" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#0f172a">Persistent workspace metadata • webhook • abortPipeline=true</text>
</g>
<path d="M640,418 L640,446" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g><rect x="100" y="446" width="1080" height="84" rx="12" fill="#dbeafe" stroke="#94a3b8"/>
<text x="116" y="476" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#0f172a">Trivy filesystem → Docker build → Trivy image</text>
<text x="116" y="504" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#0f172a">Complete reports; fixable HIGH/CRITICAL block; misconfiguration gate retained</text>
</g>
<path d="M640,530 L640,558" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g><rect x="100" y="558" width="1080" height="84" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="116" y="588" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#0f172a">Security artifacts → restricted AWS approval → immutable ECR</text>
<text x="116" y="616" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#0f172a">IAM role / account checks • matching existing SHA tag reused; conflicts fail</text>
</g>
<path d="M640,642 L640,670" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g><rect x="100" y="670" width="1080" height="84" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="116" y="700" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#0f172a">SSM preflight → restricted deployment approval → cutover</text>
<text x="116" y="728" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#0f172a">Exact digest • approved single instance • readiness / Docker / ALB • rollback</text>
</g>
<text x="40" y="862" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#64748b">Original ApexForge360 diagram • Reference examples only • No live AWS inventory verified</text>
</svg>