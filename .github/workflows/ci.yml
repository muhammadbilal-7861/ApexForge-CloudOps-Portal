name: CI
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: docker build -t apexforge-cloudops:ci .
      # TODO: CD stage: GitHub OIDC -> AWS IAM Role -> ECR -> deployment.
      # Never store long-lived AWS access keys as GitHub secrets.
