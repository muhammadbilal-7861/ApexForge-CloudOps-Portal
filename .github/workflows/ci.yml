name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --only-binary=:all: --require-hashes -r requirements.txt
      - run: pytest -q
      - run: docker build -t apexforge-cloudops:ci .
      # AWS operations are intentionally absent from public GitHub CI.
